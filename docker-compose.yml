services:
  # Local database for the backend: `docker compose up -d --wait db`.
  # DATABASE_URL: postgresql://app:app@localhost:5432/app
  # Running several apps side by side? Give each its own host port with
  # DB_PORT (for example DB_PORT=5434) and use that port in DATABASE_URL.
  # Bound to 127.0.0.1 only: with this well-known password the database must
  # not be reachable from the network the laptop is on.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - app_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_db:
